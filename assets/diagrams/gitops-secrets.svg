<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Secrets boundary: a working copy passes three checks before it reaches Git history. The gitignore file keeps sensitive files out of the index, gitleaks scans staged changes on commit, and a push script refuses to push if a sensitive file is tracked. Secrets live in a separate store and reach Terraform and Ansible at run time, never through Git.">
<defs>
<marker id="gs-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="gs-c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-acc" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="gs-x" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-bad" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="d-box" x="16" y="10" width="368" height="44" rx="6"/>
<text x="30" y="30" class="d-b">Working copy</text>
<text x="30" y="46" class="d-s">roles, modules, .example files, docs</text>
<path class="d-line" d="M200,54 V78" marker-end="url(#gs-a)"/>
<text x="210" y="72" class="d-s">git add</text>
<rect class="d-box" x="16" y="80" width="368" height="56" rx="6"/>
<rect class="d-chip" x="30" y="97" width="100" height="22" rx="11"/>
<text x="80.0" y="112" class="d-m" text-anchor="middle">.gitignore</text>
<text x="142" y="104" class="d-s">Keeps state, real tfvars, vault files,</text>
<text x="142" y="122" class="d-s">.env files and keys out of the index</text>
<path class="d-line" d="M200,136 V160" marker-end="url(#gs-a)"/>
<text x="210" y="154" class="d-s">git commit</text>
<rect class="d-box" x="16" y="162" width="368" height="56" rx="6"/>
<rect class="d-chip" x="30" y="179" width="82" height="22" rx="11"/>
<text x="71.0" y="194" class="d-m" text-anchor="middle">gitleaks</text>
<text x="124" y="186" class="d-s">Scans what is staged on every commit;</text>
<text x="124" y="204" class="d-s">a real secret blocks the commit</text>
<path class="d-line" d="M200,218 V242" marker-end="url(#gs-a)"/>
<text x="210" y="236" class="d-s">git push</text>
<rect class="d-box" x="16" y="244" width="368" height="56" rx="6"/>
<rect class="d-chip" x="30" y="261" width="100" height="22" rx="11"/>
<text x="80.0" y="276" class="d-m" text-anchor="middle">push check</text>
<text x="142" y="268" class="d-s">Script refuses to push while a vault,</text>
<text x="142" y="286" class="d-s">state or key file is tracked</text>
<path class="d-line" d="M200,300 V324" marker-end="url(#gs-a)"/>
<rect class="d-box d-ok" x="16" y="326" width="368" height="46" rx="6"/>
<text x="30" y="346" class="d-b">Git history</text>
<text x="30" y="363" class="d-s">self-hosted primary, private off-site copy</text>
<rect class="d-box" x="16" y="412" width="120" height="46" rx="6"/>
<text x="28" y="432" class="d-b">Secrets store</text>
<text x="28" y="449" class="d-s">tokens, passwords</text>
<path class="d-line d-acc d-acc" d="M136,435 H212" marker-end="url(#gs-c)"/>
<text x="174" y="427" class="d-s d-acc-t" text-anchor="middle">at run time</text>
<rect class="d-box" x="214" y="412" width="170" height="46" rx="6"/>
<text x="228" y="432" class="d-b">Terraform / Ansible</text>
<text x="228" y="449" class="d-s">env var or encrypted vars</text>
<path class="d-no d-no-line" d="M76,412 V376" marker-end="url(#gs-x)"/>
<path class="d-xmark" d="M69,387 L83,401 M83,387 L69,401"/>
<text x="94" y="398" class="d-bad">never via Git</text>
</svg>
