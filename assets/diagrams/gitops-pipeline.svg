<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Pipeline: the Git repo defines three steps. Packer builds a template once per OS. Terraform clones it into a VM after a plan is read. Ansible configures the VM after a check-mode diff is read. The result is a configured host.">
<defs>
<marker id="gp-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="gp-c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-acc" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="gp-x" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-bad" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="d-box" x="16" y="10" width="368" height="46" rx="6"/>
<text x="30" y="31" class="d-b">Git repo</text>
<text x="30" y="48" class="d-s">Packer config · Terraform code · Ansible roles</text>
<path class="d-line" d="M40,56 V345"/>
<text x="48" y="77" class="d-s">defines all three</text>
<rect class="d-box" x="64" y="86" width="320" height="78" rx="6"/>
<rect class="d-chip d-t-other" x="76" y="98" width="64" height="22" rx="11"/>
<text x="108.0" y="113" class="d-b" text-anchor="middle">Packer</text>
<text x="76" y="138">Builds the cloud-init base template</text>
<text x="76" y="154" class="d-s">once per OS, not per VM</text>
<path class="d-line" d="M40,125 H62" marker-end="url(#gp-a)"/>
<rect class="d-box" x="64" y="196" width="320" height="78" rx="6"/>
<rect class="d-chip d-t-infra" x="76" y="208" width="84" height="22" rx="11"/>
<text x="118.0" y="223" class="d-b" text-anchor="middle">Terraform</text>
<rect class="d-chip" x="228" y="208" width="144" height="22" rx="11"/>
<text x="300.0" y="223" class="d-m" text-anchor="middle">plan, read, apply</text>
<text x="76" y="248">Clones it into a VM: CPU, RAM, disk, VLAN</text>
<text x="76" y="264" class="d-s">stops once the VM boots</text>
<path class="d-line" d="M40,235 H62" marker-end="url(#gp-a)"/>
<rect class="d-box" x="64" y="306" width="320" height="78" rx="6"/>
<rect class="d-chip d-t-auto" x="76" y="318" width="70" height="22" rx="11"/>
<text x="111.0" y="333" class="d-b" text-anchor="middle">Ansible</text>
<rect class="d-chip" x="194" y="318" width="178" height="22" rx="11"/>
<text x="283.0" y="333" class="d-m" text-anchor="middle">--check --diff, apply</text>
<text x="76" y="358">Hardening, agents, services on the new VM</text>
<text x="76" y="374" class="d-s">never creates VMs</text>
<path class="d-line" d="M40,345 H62" marker-end="url(#gp-a)"/>
<path class="d-line" d="M224,164 V196" marker-end="url(#gp-a)"/>
<text x="234" y="184" class="d-s">template</text>
<path class="d-line" d="M224,274 V306" marker-end="url(#gp-a)"/>
<text x="234" y="294" class="d-s">VM exists, boots</text>
<path class="d-line" d="M224,384 V416" marker-end="url(#gp-a)"/>
<text x="234" y="404" class="d-s">configured</text>
<rect class="d-box d-ok" x="64" y="418" width="320" height="40" rx="6"/>
<text x="224" y="443" class="d-b" text-anchor="middle">Configured host</text>
</svg>
