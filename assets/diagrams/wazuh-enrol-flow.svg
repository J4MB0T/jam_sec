<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" role="img" aria-label="How the role enrols an agent: it first checks the registration password is set and fails with a message if not. It installs and configures the agent, then enrols with the manager only when the key file is missing or empty. An existing key skips enrolment, so a stale key still counts as present and only the audit&#x27;s connected check catches it. The role finishes by making sure the service is running.">
<defs>
<marker id="we-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="we-c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-acc" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="we-x" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="d-head d-head-bad" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="d-box" x="16" y="10" width="190" height="48" rx="6"/>
<text x="30" y="31" class="d-b">Password set?</text>
<text x="30" y="48" class="d-s">checked before anything else</text>
<path class="d-line" d="M206,34 H238" marker-end="url(#we-a)"/>
<text x="222" y="27" class="d-s" text-anchor="middle">no</text>
<rect class="d-box d-fail" x="240" y="14" width="144" height="40" rx="6"/>
<text x="252" y="31" class="d-b d-bad">Play fails</text>
<text x="252" y="47" class="d-s">with a clear message</text>
<path class="d-line" d="M111,58 V88" marker-end="url(#we-a)"/>
<text x="121" y="78" class="d-s">yes</text>
<rect class="d-box" x="16" y="90" width="190" height="48" rx="6"/>
<text x="30" y="111" class="d-b">Install and configure</text>
<text x="30" y="128" class="d-s">repo, package, ossec.conf</text>
<path class="d-line" d="M111,138 V168" marker-end="url(#we-a)"/>
<rect class="d-box" x="16" y="170" width="190" height="48" rx="6"/>
<text x="30" y="191" class="d-b">Key file present?</text>
<text x="30" y="208" class="d-s">exists and isn&#x27;t empty</text>
<path class="d-line" d="M206,194 H238" marker-end="url(#we-a)"/>
<text x="222" y="187" class="d-s" text-anchor="middle">yes</text>
<rect class="d-box" x="240" y="174" width="144" height="40" rx="6"/>
<text x="252" y="191" class="d-b">Skip enrol</text>
<text x="252" y="207" class="d-s">safe to re-run</text>
<path class="d-line" d="M111,218 V248" marker-end="url(#we-a)"/>
<text x="121" y="238" class="d-s">no</text>
<rect class="d-box" x="16" y="250" width="190" height="48" rx="6"/>
<text x="30" y="271" class="d-b">Enrol with the manager</text>
<text x="30" y="288" class="d-s">agent-auth, registration port</text>
<path class="d-line" d="M111,298 V328" marker-end="url(#we-a)"/>
<rect class="d-box d-ok" x="16" y="330" width="190" height="48" rx="6"/>
<text x="30" y="351" class="d-b">Service running</text>
<text x="30" y="368" class="d-s">enabled and started</text>
<path class="d-line" d="M372,214 V354 H208" marker-end="url(#we-a)"/>
<text x="240" y="244" class="d-b d-bad">Blind spot</text>
<text x="240" y="262" class="d-s">a stale key still</text>
<text x="240" y="278" class="d-s">counts as present;</text>
<text x="240" y="294" class="d-s">only the audit&#x27;s</text>
<text x="240" y="310" class="d-s">connected check</text>
<text x="240" y="326" class="d-s">catches it</text>
</svg>
